syntax = "proto3";

package acme.orders.v1;

import "google/protobuf/timestamp.proto";
import "temporal/v1/options.proto";

// Processes a customer order from payment through fulfillment.
message ProcessOrderInput {
  option (temporal.v1.operation) = {
    kind: OPERATION_KIND_WORKFLOW
    result: "ProcessOrderResult"
    task_queue: "orders"
    supports_continue_as_new: true
    timeouts: {execution: "720h"}
  };

  // Caller-chosen idempotency key.
  string order_id = 1;
  repeated LineItem items = 2;
  google.protobuf.Timestamp placed_at = 3;
}

// Outcome of an order.
message ProcessOrderResult {
  OrderStatus status = 1;
}

message LineItem {
  string sku = 1;
  // Number of units; protobuf JSON encodes int64 as a string.
  int64 quantity = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_COMPLETED = 1;
  ORDER_STATUS_CANCELLED = 2;
}

// Charges the customer's card.
message ChargeCardInput {
  option (temporal.v1.operation) = {
    kind: OPERATION_KIND_ACTIVITY
    result: "ChargeCardResult"
    task_queue: "payments"
    timeouts: {start_to_close: "30s"}
    retry_policy: {initial_interval: "1s", backoff_coefficient: 2, maximum_attempts: 5}
  };
  string order_id = 1;
  string card_token = 2;
}

message ChargeCardResult {
  string charge_id = 1;
}

// Cancels the order if it has not shipped yet.
message CancelOrderSignal {
  option (temporal.v1.operation) = {
    kind: OPERATION_KIND_SIGNAL
    name: "CancelOrder"
    workflows: "ProcessOrder"
  };
  string reason = 1;
}

// Returns the order's current status.
message GetStatusRequest {
  option (temporal.v1.operation) = {
    kind: OPERATION_KIND_QUERY
    result: "GetStatusResponse"
    workflows: "ProcessOrder"
  };
}

message GetStatusResponse {
  OrderStatus status = 1;
}

// Changes the shipping address; rejected once the order has shipped.
message UpdateAddressRequest {
  option (temporal.v1.operation) = {
    kind: OPERATION_KIND_UPDATE
    result: "UpdateAddressResponse"
    workflows: "ProcessOrder"
  };
  string address = 1;
}

message UpdateAddressResponse {
  bool accepted = 1;
}
