# Run from the repository root:
#   buf generate example/proto --template example/buf.gen.yaml
version: v2
plugins:
  - local: protoc-gen-temporal-asyncapi
    out: example/gen
    strategy: all
    opt:
      - title=Acme Orders
      - version=1.0.0
      - server-url=temporal.acme.internal:7233
      - namespace=orders
