# Regenerates the Go bindings of the annotations (`make generate`).
version: v2
inputs:
  - directory: proto/amqp
  - directory: proto/asyncapi
  - directory: proto/nats
  - directory: proto/redis
  - directory: proto/temporal
plugins:
  - local: protoc-gen-go
    out: pb
    opt: module=github.com/AustinZhu/protoc-gen-asyncapi/pb
