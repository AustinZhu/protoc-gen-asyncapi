# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: protoc-gen-asyncapi

builds:
  - &build
    id: protoc-gen-asyncapi
    main: ./cmd/protoc-gen-asyncapi
    binary: protoc-gen-asyncapi
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
  - <<: *build
    id: protoc-gen-amqp-asyncapi
    main: ./cmd/protoc-gen-amqp-asyncapi
    binary: protoc-gen-amqp-asyncapi
  - <<: *build
    id: protoc-gen-googlepubsub-asyncapi
    main: ./cmd/protoc-gen-googlepubsub-asyncapi
    binary: protoc-gen-googlepubsub-asyncapi
  - <<: *build
    id: protoc-gen-nats-asyncapi
    main: ./cmd/protoc-gen-nats-asyncapi
    binary: protoc-gen-nats-asyncapi
  - <<: *build
    id: protoc-gen-redis-asyncapi
    main: ./cmd/protoc-gen-redis-asyncapi
    binary: protoc-gen-redis-asyncapi
  - <<: *build
    id: protoc-gen-temporal-asyncapi
    main: ./cmd/protoc-gen-temporal-asyncapi
    binary: protoc-gen-temporal-asyncapi

# One archive per binary, named <binary>_<version>_<os>_<arch>, the naming
# "fetch a binary from a GitHub release" installers (ubi, aqua, mise) expect.
archives:
  - &archive
    id: protoc-gen-asyncapi
    ids: [protoc-gen-asyncapi]
    formats: [tar.gz]
    name_template: "protoc-gen-asyncapi_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - proto/**/*.proto
  - <<: *archive
    id: protoc-gen-amqp-asyncapi
    ids: [protoc-gen-amqp-asyncapi]
    name_template: "protoc-gen-amqp-asyncapi_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - <<: *archive
    id: protoc-gen-googlepubsub-asyncapi
    ids: [protoc-gen-googlepubsub-asyncapi]
    name_template: "protoc-gen-googlepubsub-asyncapi_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - <<: *archive
    id: protoc-gen-nats-asyncapi
    ids: [protoc-gen-nats-asyncapi]
    name_template: "protoc-gen-nats-asyncapi_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - <<: *archive
    id: protoc-gen-redis-asyncapi
    ids: [protoc-gen-redis-asyncapi]
    name_template: "protoc-gen-redis-asyncapi_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - <<: *archive
    id: protoc-gen-temporal-asyncapi
    ids: [protoc-gen-temporal-asyncapi]
    name_template: "protoc-gen-temporal-asyncapi_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
