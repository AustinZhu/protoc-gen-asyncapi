name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # Includes validation of every golden document against the AsyncAPI
      # 3.0.0/3.1.0 JSON Schemas.
      - run: go test -race ./...

  generated:
    # The committed Go bindings and example output must match the sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - run: buf lint
      - run: buf format --diff --exit-code
      - run: buf generate
      - run: buf generate --template examples/buf.gen.yaml
      - name: Check for uncommitted changes
        run: git diff --exit-code

  asyncapi-spec:
    # Every golden document and the example must pass the official AsyncAPI parser.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/asyncapi-validate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/asyncapi-validate/package-lock.json
      - run: npm ci
      - run: node validate.mjs
