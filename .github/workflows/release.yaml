name: release

on:
  push:
    tags: ["v*"]
  # Manual release from the default branch: creates the tag, then releases it.
  workflow_dispatch:
    inputs:
      version:
        description: Tag to create and release, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  BUF_VERSION: "1.73.0"
  # The modules published to the BSR (their names are in buf.yaml): the
  # shared asyncapi.v3 annotations and each protocol's annotations. The
  # example modules are never published.
  BSR_MODULE_PATHS: proto/asyncapi proto/nats proto/redis proto/temporal

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "::error::Manual releases must run from the default branch ($DEFAULT_BRANCH), not $REF."
              exit 1
            fi
            tag="$INPUT_VERSION"
          elif [[ "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          else
            echo "::error::Releases run only for version tags or manual dispatch, not $REF."
            exit 1
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or v1.2.3-rc.1, got '$tag'."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yaml

  buf-checks:
    # Lint, breaking-change and publication-config checks for the BSR modules.
    # Runs before anything is tagged or published, so a misconfigured release
    # fails closed without side effects.
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - name: Lint
        run: |
          for path in $BSR_MODULE_PATHS; do
            buf lint "$path" --error-format github-actions
          done
      - name: Breaking changes against the previous release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$TAG" HEAD 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "::notice::No earlier release tag; skipping the breaking-change check."
            exit 0
          fi
          # Semver: breaking changes need a major bump, or a minor bump while
          # the major version is 0.
          IFS=. read -r pmaj pmin _ <<< "${prev#v}"
          IFS=. read -r nmaj nmin _ <<< "${TAG#v}"
          breaking_allowed=false
          if [ "$nmaj" != "$pmaj" ] || { [ "$nmaj" = 0 ] && [ "$nmin" != "$pmin" ]; }; then
            breaking_allowed=true
            echo "::notice::$TAG is a breaking release relative to $prev; reporting breaking changes without failing."
          fi
          for path in $BSR_MODULE_PATHS; do
            if ! git cat-file -e "${prev}:${path}" 2>/dev/null; then
              echo "::notice::$path did not exist at $prev; nothing to compare."
              continue
            fi
            echo "Comparing $path against $prev"
            if [ "$breaking_allowed" = true ]; then
              buf breaking "$path" --against ".git#tag=${prev},subdir=${path}" || true
            else
              buf breaking "$path" --against ".git#tag=${prev},subdir=${path}" --error-format github-actions
            fi
          done
      - name: Verify BSR publication config
        env:
          # Only whether the secret is set; the value is never exposed to this job.
          HAS_BUF_TOKEN: ${{ secrets.BUF_TOKEN != '' }}
        run: |
          for path in $BSR_MODULE_PATHS; do
            name="$(buf config ls-modules --format json | jq -r --arg p "$path" 'select(.path == $p) | .name // empty')"
            if [ -z "$name" ]; then
              echo "::error file=buf.yaml::The '$path' module has no 'name' in buf.yaml, so the BSR module to publish to is unknown. Set it (e.g. name: buf.build/<owner>/<module>) before releasing."
              exit 1
            fi
            if ! [[ "$name" =~ ^buf\.build/[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error file=buf.yaml::BSR module name '$name' is not of the form buf.build/<owner>/<module>."
              exit 1
            fi
            echo "Will publish $path to $name"
          done
          if [ "$HAS_BUF_TOKEN" != true ]; then
            echo "::error::The BUF_TOKEN Actions secret is not set; refusing to release without BSR credentials."
            exit 1
          fi

  release:
    needs: [prepare, ci, buf-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bsr-publish:
    # Publishes only the annotation modules, only from this repository (never
    # a fork), and only for the release tag validated above.
    needs: [prepare, release]
    if: github.repository == 'AustinZhu/protoc-gen-asyncapi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - name: Push to the BSR
        env:
          # buf reads the token from the environment; it is never logged or
          # written to disk (no `buf registry login`, which would store it).
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$BUF_TOKEN" ]; then
            echo "::error::The BUF_TOKEN Actions secret is not set."
            exit 1
          fi
          for path in $BSR_MODULE_PATHS; do
            name="$(buf config ls-modules --format json | jq -r --arg p "$path" 'select(.path == $p) | .name // empty')"
            if [ -z "$name" ]; then
              echo "::error file=buf.yaml::The '$path' module has no 'name' in buf.yaml."
              exit 1
            fi
            echo "Publishing $path to $name with label $TAG"
            buf push "$path" --label "$TAG" --source-control-url "$SOURCE_URL" --error-format github-actions
          done
