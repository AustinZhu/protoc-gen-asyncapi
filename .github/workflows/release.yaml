name: release

on:
  push:
    tags: ["v*"]
  # Manual release from the default branch: creates the tag, then releases it.
  workflow_dispatch:
    inputs:
      version:
        description: Tag to create and release, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  BUF_VERSION: "1.73.0"
  # The only module published to the BSR: temporal/asyncapi/v1/options.proto.
  BSR_MODULE_PATH: proto

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "::error::Manual releases must run from the default branch ($DEFAULT_BRANCH), not $REF."
              exit 1
            fi
            tag="$INPUT_VERSION"
          elif [[ "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          else
            echo "::error::Releases run only for version tags or manual dispatch, not $REF."
            exit 1
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or v1.2.3-rc.1, got '$tag'."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yaml

  buf-checks:
    # Lint, breaking-change and publication-config checks for the BSR module.
    # Runs before anything is tagged or published, so a misconfigured release
    # fails closed without side effects.
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - name: Lint
        run: buf lint "$BSR_MODULE_PATH" --error-format github-actions
      - name: Breaking changes against the previous release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$TAG" HEAD 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "::notice::No earlier release tag; skipping the breaking-change check."
            exit 0
          fi
          # Semver: breaking changes need a major bump, or a minor bump while
          # the major version is 0.
          IFS=. read -r pmaj pmin _ <<< "${prev#v}"
          IFS=. read -r nmaj nmin _ <<< "${TAG#v}"
          if [ "$nmaj" != "$pmaj" ] || { [ "$nmaj" = 0 ] && [ "$nmin" != "$pmin" ]; }; then
            echo "::notice::$TAG is a breaking release relative to $prev; reporting breaking changes without failing."
            buf breaking "$BSR_MODULE_PATH" --against ".git#tag=${prev},subdir=${BSR_MODULE_PATH}" || true
            exit 0
          fi
          echo "Comparing $BSR_MODULE_PATH against $prev"
          buf breaking "$BSR_MODULE_PATH" --against ".git#tag=${prev},subdir=${BSR_MODULE_PATH}" --error-format github-actions
      - name: Verify BSR publication config
        env:
          # Only whether the secret is set; the value is never exposed to this job.
          HAS_BUF_TOKEN: ${{ secrets.BUF_TOKEN != '' }}
        run: |
          name="$(buf config ls-modules --format json | jq -r --arg p "$BSR_MODULE_PATH" 'select(.path == $p) | .name // empty')"
          if [ -z "$name" ]; then
            echo "::error file=buf.yaml::The '$BSR_MODULE_PATH' module has no 'name' in buf.yaml, so the BSR module to publish to is unknown. Set it (e.g. name: buf.build/<owner>/<module>) before releasing."
            exit 1
          fi
          if ! [[ "$name" =~ ^buf\.build/[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error file=buf.yaml::BSR module name '$name' is not of the form buf.build/<owner>/<module>."
            exit 1
          fi
          if [ "$HAS_BUF_TOKEN" != true ]; then
            echo "::error::The BUF_TOKEN Actions secret is not set; refusing to release without BSR credentials."
            exit 1
          fi
          echo "Will publish $BSR_MODULE_PATH to $name"

  release:
    needs: [prepare, ci, buf-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bsr-publish:
    # Publishes only the options module, only from this repository (never a
    # fork), and only for the release tag validated above.
    needs: [prepare, release]
    if: github.repository == 'AustinZhu/protoc-gen-temporal-asyncapi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - name: Push to the BSR
        env:
          # buf reads the token from the environment; it is never logged or
          # written to disk (no `buf registry login`, which would store it).
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$BUF_TOKEN" ]; then
            echo "::error::The BUF_TOKEN Actions secret is not set."
            exit 1
          fi
          name="$(buf config ls-modules --format json | jq -r --arg p "$BSR_MODULE_PATH" 'select(.path == $p) | .name // empty')"
          if [ -z "$name" ]; then
            echo "::error file=buf.yaml::The '$BSR_MODULE_PATH' module has no 'name' in buf.yaml."
            exit 1
          fi
          echo "Publishing $BSR_MODULE_PATH to $name with label $TAG"
          buf push "$BSR_MODULE_PATH" --label "$TAG" --source-control-url "$SOURCE_URL" --error-format github-actions
