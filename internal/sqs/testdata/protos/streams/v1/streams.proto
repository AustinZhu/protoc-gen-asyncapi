// How rpc shapes map onto AsyncAPI operations.
syntax = "proto3";

package streams.v1;

import "google/protobuf/empty.proto";
import "sqs/asyncapi/v1/annotations.proto";

option (sqs.asyncapi.v1.document) = {
  queues: [{name: "shapes-raw.fifo" content_based_deduplication: true}]
};

// Rpc shapes.
service Shapes {
  option (sqs.asyncapi.v1.service) = {queue_prefix: "shapes"};

  // A request answered by a stream of results: request/reply, as the number
  // of replies is not an AsyncAPI concept.
  rpc Search(Query) returns (stream Hit) {
    option (sqs.asyncapi.v1.operation) = {queue: "search" reply_queue: "search-results" reply_messages: ["streams.v1.SearchDone"]};
  }

  // A stream processor: receives readings and sends enriched ones.
  rpc Enrich(stream Reading) returns (stream Enriched) {
    option (sqs.asyncapi.v1.operation) = {queue: "readings"};
  }

  // A processor with its own output and settings for both sides.
  rpc Normalize(stream Reading) returns (stream Enriched) {
    option (sqs.asyncapi.v1.operation) = {
      queue: "raw.fifo"
      output: "normalized"
      send: {delay: "5s" batch: true}
      receive: {max_messages: 10 wait_time: "20s"}
    };
  }

  // A unary rpc declared as a processor.
  rpc Convert(Reading) returns (Enriched) {
    option (sqs.asyncapi.v1.operation) = {pattern: PATTERN_PROCESS queue: "convert"};
  }

  // Still a publication: no request.
  rpc Ticks(google.protobuf.Empty) returns (stream Hit) {
    option (sqs.asyncapi.v1.operation) = {queue: "ticks"};
  }

  // A stream of requests without response: a subscription.
  rpc Ingest(stream Reading) returns (google.protobuf.Empty) {
    option (sqs.asyncapi.v1.operation) = {queue: "ingest"};
  }
}

message Query {
  string text = 1;
}

message Hit {
  string id = 1;
}

// Ends a search.
message SearchDone {
  int32 total = 1;
}

message Reading {
  string sensor = 1;
  double value = 2;
}

message Enriched {
  string sensor = 1;
  double value = 2;
  string unit = 3;
}
