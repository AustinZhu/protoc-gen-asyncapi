// How rpc shapes map onto AsyncAPI operations.
syntax = "proto3";

package streams.v1;

import "google/protobuf/empty.proto";
import "amqp/asyncapi/v1/annotations.proto";

option (amqp.asyncapi.v1.document) = {
  exchanges: [{name: "shapes" type: EXCHANGE_TYPE_TOPIC durable: true}]
};

// Rpc shapes.
service Shapes {
  option (amqp.asyncapi.v1.service) = {exchange: "shapes" routing_key_prefix: "shapes" prefetch: 20};

  // A request answered by a stream of results: request/reply, as the number
  // of replies is not an AsyncAPI concept.
  rpc Search(Query) returns (stream Hit) {
    option (amqp.asyncapi.v1.operation) = {routing_key: "search" queue: "search" reply_messages: ["streams.v1.SearchDone"]};
  }

  // A stream processor: receives readings and sends enriched ones.
  rpc Enrich(stream Reading) returns (stream Enriched) {
    option (amqp.asyncapi.v1.operation) = {routing_key: "readings.*" queue: "enrich" output: "enriched"};
  }

  // A processor with its own output and settings for both sides.
  rpc Normalize(stream Reading) returns (stream Enriched) {
    option (amqp.asyncapi.v1.operation) = {
      routing_key: "raw.{sensor}"
      queue: "normalize"
      output: "normalized.{sensor}"
      publish: {delivery_mode: DELIVERY_MODE_PERSISTENT confirm: true}
      consume: {prefetch: 50}
    };
  }

  // A unary rpc declared as a processor.
  rpc Convert(Reading) returns (Enriched) {
    option (amqp.asyncapi.v1.operation) = {pattern: PATTERN_PROCESS routing_key: "convert" queue: "convert"};
  }

  // Still a publication: no request.
  rpc Ticks(google.protobuf.Empty) returns (stream Hit) {
    option (amqp.asyncapi.v1.operation) = {routing_key: "ticks"};
  }

  // A stream of requests without response: a subscription.
  rpc Ingest(stream Reading) returns (google.protobuf.Empty) {
    option (amqp.asyncapi.v1.operation) = {routing_key: "ingest" queue: "ingest"};
  }
}

message Query {
  string text = 1;
}

message Hit {
  string id = 1;
}

// Ends a search.
message SearchDone {
  int32 total = 1;
}

message Reading {
  string sensor = 1;
  double value = 2;
}

message Enriched {
  string sensor = 1;
  double value = 2;
  string unit = 3;
}
