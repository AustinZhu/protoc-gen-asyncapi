syntax = "proto3";

package acme.fulfillment.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "temporal/asyncapi/v1/options.proto";

service Fulfillment {
  option (temporal.asyncapi.v1.service) = {task_queue: "fulfillment"};

  // Processes a customer order from payment through fulfillment.
  //
  // Long-running: continues-as-new every 1,000 events.
  rpc ProcessOrder(ProcessOrderInput) returns (ProcessOrderResult) {
    option (temporal.asyncapi.v1.operation).workflow = {
      continue_as_new: true
      execution_timeout: "720h"
      task_timeout: "10s"
      retry_policy: {
        initial_interval: "1s"
        backoff_coefficient: 2
        maximum_attempts: 5
        non_retryable_error_types: ["InvalidOrder"]
      }
    };
  }
}

// Input of ProcessOrder.
message ProcessOrderInput {
  // Idempotency key supplied by the caller.
  string order_id = 1;
  Customer customer = 2;
  repeated LineItem items = 3;
  // Arbitrary labels, e.g. {"channel": "web"}.
  map<string, string> labels = 4;
  google.protobuf.Timestamp placed_at = 5;
  google.protobuf.Duration payment_deadline = 6;
  google.protobuf.StringValue coupon = 7;
  optional string note = 8;

  // How the order is paid.
  oneof payment {
    string card_token = 9;
    string invoice_account = 10;
  }
  int64 total_cents = 11;
  uint32 attempt = 12;
  bytes signature = 13;
  map<int32, LineItem> items_by_position = 14;
  string external_ref = 15 [deprecated = true];
}

message Customer {
  string id = 1;
  string email = 2;
  // Recursive reference to a referring customer.
  Customer referred_by = 3;
}

message LineItem {
  string sku = 1;
  int32 quantity = 2;
  double unit_price = 3;
}

message ProcessOrderResult {
  OrderStatus status = 1; // Final status.
  google.protobuf.Timestamp completed_at = 2;
}

// Lifecycle of an order.
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  // Payment and shipping succeeded.
  ORDER_STATUS_COMPLETED = 1;
  // Payment failed or the order was cancelled.
  ORDER_STATUS_FAILED = 2;
}

// Not referenced by any operation; kept unless trim-unused-schemas is set.
message AuditRecord {
  string actor = 1;
}
