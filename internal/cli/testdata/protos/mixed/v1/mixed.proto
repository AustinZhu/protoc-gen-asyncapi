// Order processing that runs on Temporal, publishes events on NATS, queues
// receipts on Redis and invoices on RabbitMQ, exports analytics to Google
// Pub/Sub, streams order history to Kafka and notifies the warehouse over
// MQTT: seven protocols in one AsyncAPI document.
syntax = "proto3";

package mixed.v1;

import "amqp/asyncapi/v1/annotations.proto";
import "asyncapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "googlepubsub/asyncapi/v1/annotations.proto";
import "kafka/asyncapi/v1/annotations.proto";
import "mqtt/asyncapi/v1/annotations.proto";
import "nats/asyncapi/v1/annotations.proto";
import "redis/asyncapi/v1/annotations.proto";
import "temporal/asyncapi/v1/options.proto";

option (asyncapi.v3.document) = {
  info: {title: "Orders", version: "1.0.0"}
  servers: [
    {name: "nats", host: "nats.example:4222", protocol: "nats"},
    {name: "temporal", host: "temporal.example:7233", protocol: "temporal"},
    {name: "redis", host: "redis.example:6379", protocol: "redis"},
    {name: "rabbitmq", host: "rabbitmq.example:5672", protocol: "amqp"},
    {name: "pubsub", host: "pubsub.googleapis.com:443", protocol: "googlepubsub"},
    {name: "kafka", host: "kafka.example:9092", protocol: "kafka"},
    {name: "mqtt", host: "mqtt.example:1883", protocol: "mqtt"}
  ]
};

option (temporal.asyncapi.v1.document) = {
  servers: [{name: "temporal", namespace: "orders"}]
};

// The order workflow.
service OrderWorkflows {
  option (temporal.asyncapi.v1.service) = {task_queue: "orders"};
  option (asyncapi.v3.service) = {servers: ["temporal"]};

  // Processes an order.
  rpc ProcessOrder(Order) returns (OrderResult) {
    option (temporal.asyncapi.v1.operation).workflow = {};
  }
}

// Order events, published by the workflow's activities.
service Events {
  option (nats.asyncapi.v1.service) = {subject_prefix: "orders"};
  option (asyncapi.v3.service) = {servers: ["nats"]};

  // Published when an order completes.
  rpc Completed(google.protobuf.Empty) returns (stream OrderResult) {
    option (nats.asyncapi.v1.operation) = {subject: "{order_id}.completed"};
  }
}

// Receipts, sent by a worker pool reading a Redis stream.
service Receipts {
  option (redis.asyncapi.v1.service) = {
    key_prefix: "orders"
    transport: TRANSPORT_STREAM
    consumer_group: "receipts"
  };
  option (asyncapi.v3.service) = {servers: ["redis"]};

  // Sends the receipt of a completed order.
  rpc Send(OrderResult) returns (google.protobuf.Empty) {
    option (redis.asyncapi.v1.operation) = {channel: "receipts"};
  }
}

// Invoices, issued by a RabbitMQ consumer.
service Invoicing {
  option (asyncapi.v3.service) = {servers: ["rabbitmq"]};

  // Issues the invoice of a completed order.
  rpc Issue(OrderResult) returns (google.protobuf.Empty) {
    option (amqp.asyncapi.v1.operation) = {queue: "orders.invoices"};
  }
}

// Analytics, exported to Google Pub/Sub.
service Analytics {
  option (asyncapi.v3.service) = {servers: ["pubsub"]};

  // Exports completed orders.
  rpc Export(google.protobuf.Empty) returns (stream OrderResult) {
    option (googlepubsub.asyncapi.v1.operation) = {topic: "orders.completed"};
  }
}

// Order history, streamed to Kafka.
service History {
  option (asyncapi.v3.service) = {servers: ["kafka"]};

  // Records completed orders.
  rpc Record(google.protobuf.Empty) returns (stream OrderResult) {
    option (kafka.asyncapi.v1.operation) = {topic: "orders.history"};
  }
}

// Warehouse notifications over MQTT.
service Warehouse {
  option (asyncapi.v3.service) = {servers: ["mqtt"]};

  // Notifies the warehouse of completed orders.
  rpc Notify(google.protobuf.Empty) returns (stream OrderResult) {
    option (mqtt.asyncapi.v1.operation) = {topic: "warehouse/orders"};
  }
}

message Order {
  string order_id = 1;
}

message OrderResult {
  string order_id = 1;
  bool ok = 2;
}
