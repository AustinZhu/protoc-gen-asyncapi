// How rpc shapes map onto AsyncAPI operations.
syntax = "proto3";

package streams.v1;

import "google/protobuf/empty.proto";
import "googlepubsub/asyncapi/v1/annotations.proto";

// Rpc shapes.
service Shapes {
  option (googlepubsub.asyncapi.v1.service) = {topic_prefix: "shapes" subscription: "shapes"};

  // A request answered by a stream of results: request/reply, as the number
  // of replies is not an AsyncAPI concept.
  rpc Search(Query) returns (stream Hit) {
    option (googlepubsub.asyncapi.v1.operation) = {topic: "search" reply_topic: "search.results" reply_messages: ["streams.v1.SearchDone"] subscription: "search"};
  }

  // A stream processor: receives readings and sends enriched ones.
  rpc Enrich(stream Reading) returns (stream Enriched) {
    option (googlepubsub.asyncapi.v1.operation) = {topic: "readings" subscription: "enrich"};
  }

  // A processor with its own output and settings for both sides.
  rpc Normalize(stream Reading) returns (stream Enriched) {
    option (googlepubsub.asyncapi.v1.operation) = {
      topic: "raw"
      subscription: "normalize"
      output: "normalized"
      publish: {ordering_key: "{sensor}" compression: true}
      consume: {max_outstanding_messages: 100}
    };
  }

  // A unary rpc declared as a processor.
  rpc Convert(Reading) returns (Enriched) {
    option (googlepubsub.asyncapi.v1.operation) = {pattern: PATTERN_PROCESS topic: "convert" subscription: "convert"};
  }

  // Still a publication: no request.
  rpc Ticks(google.protobuf.Empty) returns (stream Hit) {
    option (googlepubsub.asyncapi.v1.operation) = {topic: "ticks"};
  }

  // A stream of requests without response: a subscription.
  rpc Ingest(stream Reading) returns (google.protobuf.Empty) {
    option (googlepubsub.asyncapi.v1.operation) = {topic: "ingest" subscription: "ingest"};
  }
}

message Query {
  string text = 1;
}

message Hit {
  string id = 1;
}

// Ends a search.
message SearchDone {
  int32 total = 1;
}

message Reading {
  string sensor = 1;
  double value = 2;
}

message Enriched {
  string sensor = 1;
  double value = 2;
  string unit = 3;
}
