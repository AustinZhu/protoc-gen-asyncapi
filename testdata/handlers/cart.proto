syntax = "proto3";

package acme.cart.v1;

import "google/protobuf/empty.proto";
import "temporal/v1/options.proto";

// A shopping cart that lives as long as the session.
message CartWorkflowInput {
  option (temporal.v1.operation) = {kind: OPERATION_KIND_WORKFLOW};
  string session_id = 1;
}

// Adds an item to the cart.
message AddItemSignal {
  option (temporal.v1.operation) = {
    kind: OPERATION_KIND_SIGNAL
    name: "AddItem"
    workflows: ["CartWorkflow"]
  };
  string sku = 1;
  int32 quantity = 2;
}

// Returns the current cart contents.
message GetCartRequest {
  option (temporal.v1.operation) = {
    kind: OPERATION_KIND_QUERY
    result: "CartState"
    workflows: "CartWorkflow"
  };
}

message CartState {
  repeated string skus = 1;
}

// Checks out the cart, validating stock before accepting.
message CheckoutRequest {
  option (temporal.v1.operation) = {
    kind: OPERATION_KIND_UPDATE
    result: "CheckoutResult"
    workflows: "CartWorkflow"
  };
  string payment_method = 1;
}

message CheckoutResult {
  string order_id = 1;
}

// Clears the cart; completes with no result.
message ClearRequest {
  option (temporal.v1.operation) = {
    kind: OPERATION_KIND_UPDATE
    name: "Clear"
    workflows: "CartWorkflow"
  };
  google.protobuf.Empty nothing = 1;
}
