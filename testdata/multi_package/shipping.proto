syntax = "proto3";

package acme.shipping.v1;

import "temporal/v1/options.proto";

// Ships a parcel. Its result shares its short name with billing's Invoice.
message ShipParcelInput {
  option (temporal.v1.operation) = {kind: OPERATION_KIND_WORKFLOW, result: "Invoice"};
  string address = 1;
}

message Invoice {
  string tracking_number = 1;
}
