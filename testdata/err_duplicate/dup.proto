syntax = "proto3";

package dup.v1;

import "temporal/v1/options.proto";

message FirstInput {
  option (temporal.v1.operation) = {kind: OPERATION_KIND_SIGNAL, name: "Poke"};
}

message SecondInput {
  option (temporal.v1.operation) = {kind: OPERATION_KIND_SIGNAL, name: "Poke"};
}

// Same name, different kind: allowed.
message PokeQuery {
  option (temporal.v1.operation) = {kind: OPERATION_KIND_QUERY, name: "Poke"};
}
