# Workspace: the published annotation modules and the (unpublished)
# examples. See .github/workflows/release.yaml for publishing.
version: v2
modules:
  - path: proto/amqp
    name: buf.build/austin-zhu/amqp-asyncapi
  - path: proto/asyncapi
    name: buf.build/austin-zhu/asyncapi
  - path: proto/googlepubsub
    name: buf.build/austin-zhu/googlepubsub-asyncapi
  - path: proto/kafka
    name: buf.build/austin-zhu/kafka-asyncapi
  - path: proto/mqtt
    name: buf.build/austin-zhu/mqtt-asyncapi
  - path: proto/nats
    name: buf.build/austin-zhu/nats-asyncapi
  - path: proto/redis
    name: buf.build/austin-zhu/redis-asyncapi
  - path: proto/temporal
    name: buf.build/austin-zhu/temporal-asyncapi
  - path: examples/amqp/proto
  - path: examples/googlepubsub/proto
  - path: examples/kafka/proto
  - path: examples/mqtt/proto
  - path: examples/nats/proto
  - path: examples/redis/proto
  - path: examples/temporal/proto
lint:
  use:
    - STANDARD
  ignore_only:
    # Payloads are named after their operation (…Input / …Result, events)
    # and many operations take or return google.protobuf.Empty.
    RPC_REQUEST_RESPONSE_UNIQUE:
      - examples/amqp/proto/acme
      - examples/googlepubsub/proto/acme
      - examples/kafka/proto/acme
      - examples/mqtt/proto/acme
      - examples/nats/proto/acme
      - examples/redis/proto/acme
      - examples/temporal/proto/acme
    RPC_REQUEST_STANDARD_NAME:
      - examples/amqp/proto/acme
      - examples/googlepubsub/proto/acme
      - examples/kafka/proto/acme
      - examples/mqtt/proto/acme
      - examples/nats/proto/acme
      - examples/redis/proto/acme
      - examples/temporal/proto/acme
    RPC_RESPONSE_STANDARD_NAME:
      - examples/amqp/proto/acme
      - examples/googlepubsub/proto/acme
      - examples/kafka/proto/acme
      - examples/mqtt/proto/acme
      - examples/nats/proto/acme
      - examples/redis/proto/acme
      - examples/temporal/proto/acme
    SERVICE_SUFFIX:
      - examples/amqp/proto/acme
      - examples/googlepubsub/proto/acme
      - examples/kafka/proto/acme
      - examples/mqtt/proto/acme
      - examples/nats/proto/acme
      - examples/redis/proto/acme
      - examples/temporal/proto/acme
breaking:
  use:
    - FILE
