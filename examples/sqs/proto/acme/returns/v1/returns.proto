// Returns for the ACME shop, on Amazon SQS.
//
// Return requests go through a FIFO queue, in order per order, and are
// dead-lettered after repeated failures; approved returns queue a refund.
syntax = "proto3";

package acme.returns.v1;

import "asyncapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "sqs/asyncapi/v1/annotations.proto";

option (asyncapi.v3.document) = {
  info: {
    title: "ACME Returns"
    version: "1.1.0"
    contact: {
      name: "Returns team"
      email: "returns@acme.example"
    }
  }
  id: "urn:acme:returns"
  servers: [
    {
      name: "production"
      host: "sqs.eu-west-1.amazonaws.com"
      protocol: "sqs"
      description: "Amazon SQS in eu-west-1."
    },
    {
      name: "local"
      host: "localhost:4566"
      protocol: "sqs"
      description: "LocalStack on your machine."
    }
  ]
};
option (sqs.asyncapi.v1.document) = {
  region: "eu-west-1"
  account_id: "123456789012"
  servers: [
    {name: "production"},
    {
      name: "local"
      account_id: "000000000000"
    }
  ]
  queues: [
    {
      name: "returns.fifo"
      content_based_deduplication: true
      visibility_timeout: "2m"
      receive_wait_time: "20s"
      dead_letter_queue: "returns-dlq.fifo"
      max_receive_count: 5
      sqs_managed_sse: true
      policy: [
        {
          effect: EFFECT_ALLOW
          principals: ["sns.amazonaws.com"]
          actions: ["sqs:SendMessage"]
        }
      ]
      description: "Return requests, in order per order."
    },
    {
      name: "returns-dlq.fifo"
      message_retention: "336h"
      description: "Return requests that repeatedly failed."
    },
    {
      name: "refunds"
      delivery_delay: "1m"
      sqs_managed_sse: true
      description: "Refunds to pay out."
    }
  ]
};

// Return handling.
service Returns {
  // Processes a return request.
  rpc Process(ReturnRequested) returns (google.protobuf.Empty) {
    option (sqs.asyncapi.v1.operation) = {
      queue: "returns.fifo"
      send: {message_group_id: "{order_id}"}
      receive: {
        max_messages: 10
        wait_time: "20s"
      }
    };
  }

  // Queues the refund of an approved return.
  rpc Refunds(google.protobuf.Empty) returns (stream RefundDue) {
    option (sqs.asyncapi.v1.operation) = {
      queue: "refunds"
      send: {batch: true}
    };
  }
}

// A customer asked to return items.
message ReturnRequested {
  string return_id = 1;
  string order_id = 2;
  repeated string skus = 3;
  google.protobuf.Timestamp requested_at = 4;
}

// A refund to pay.
message RefundDue {
  string return_id = 1;
  int64 amount_cents = 2;
}
