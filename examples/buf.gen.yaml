# Generates the example AsyncAPI documents (`make examples`), run from the
# repository root: buf generate --template examples/buf.gen.yaml
version: v2
inputs:
  - directory: examples/amqp/proto
  - directory: examples/googlepubsub/proto
  - directory: examples/kafka/proto
  - directory: examples/mqtt/proto
  - directory: examples/nats/proto
  - directory: examples/redis/proto
  - directory: examples/sqs/proto
  - directory: examples/temporal/proto
plugins:
  - local: ["go", "run", "-buildvcs=false", "./cmd/protoc-gen-asyncapi"]
    out: examples/asyncapi
